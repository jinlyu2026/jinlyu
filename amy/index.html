<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI心理智能体工作坊 · 客服 Amy</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card: #ffffff;
    --ink: #2c3440;
    --ink-soft: #6b7686;
    --accent: #4a6fa5;
    --accent-soft: #eef3fa;
    --line: #e8ecf1;
    --user-bubble: #4a6fa5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink);
    height: 100vh; display: flex; flex-direction: column;
  }
  /* ===== 顶栏 ===== */
  header {
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: 14px 18px; display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 5;
  }
  .logo {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, #4a6fa5, #6d94c4);
    color: #fff; font-size: 19px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .title-wrap { flex: 1; min-width: 0; }
  .title { font-size: 16px; font-weight: 600; }
  .subtitle { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .status {
    font-size: 12px; padding: 4px 10px; border-radius: 20px;
    background: var(--accent-soft); color: var(--accent); white-space: nowrap;
  }
  .status.off { background: #fdeeee; color: #b05a5a; }
  /* ===== 消息区 ===== */
  #chat {
    flex: 1; overflow-y: auto; padding: 20px 16px 12px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { display: flex; gap: 10px; max-width: 860px; width: 100%; margin: 0 auto; }
  .msg .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .msg.ai .avatar { background: var(--accent-soft); }
  .msg.me { flex-direction: row-reverse; }
  .msg.me .avatar { background: #f0ece4; }
  .bubble {
    padding: 11px 14px; border-radius: 14px; font-size: 15px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word; text-align: left;
  }
  .msg.ai .bubble { background: var(--card); border: 1px solid var(--line); }
  .msg.me .bubble { background: var(--user-bubble); color: #fff; }
  /* 欢迎卡片 */
  .welcome {
    max-width: 860px; margin: 8px auto 0; width: 100%;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 22px 20px;
  }
  .welcome h2 { font-size: 17px; margin-bottom: 8px; }
  .welcome p { font-size: 14px; color: var(--ink-soft); line-height: 1.7; }
  /* 快捷问题 */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip {
    padding: 7px 14px; border-radius: 18px; border: 1px solid var(--line);
    background: var(--bg); font-size: 13px; color: var(--ink); cursor: pointer;
    transition: all .15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  /* 打字光标 & 状态 */
  .cursor { display: inline-block; width: 2px; height: 15px; background: var(--accent);
    margin-left: 2px; animation: blink 1s infinite; vertical-align: -2px; }
  @keyframes blink { 50% { opacity: 0; } }
  .thinking { font-size: 13px; color: var(--ink-soft); }
  .thinking .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  /* 引用来源 */
  .refs { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .refs .ref-title { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  .refs a { font-size: 12px; color: var(--accent); text-decoration: none; display: inline-block;
    margin: 2px 8px 2px 0; }
  .refs a:hover { text-decoration: underline; }
  /* 错误 */
  .bubble.err { background: #fdf2f2 !important; color: #a04b4b; border-color: #f3d9d9 !important; }
  /* ===== 输入区 ===== */
  footer {
    border-top: 1px solid var(--line); background: var(--card);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .input-row {
    max-width: 860px; margin: 0 auto; display: flex; gap: 10px;
  }
  #input {
    flex: 1; border: 1px solid var(--line); border-radius: 22px;
    padding: 11px 18px; font-size: 15px; outline: none; background: var(--bg);
    color: var(--ink); font-family: inherit;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    border: none; background: var(--accent); color: #fff; border-radius: 22px;
    padding: 0 22px; font-size: 15px; cursor: pointer; font-family: inherit;
  }
  #send:disabled { opacity: .45; cursor: default; }
  #send:not(:disabled):hover { background: #3d5d8b; }
  .footnote {
    max-width: 860px; margin: 8px auto 0; text-align: center;
    font-size: 11px; color: var(--ink-soft);
  }
</style>
</head>
<body>

<header>
  <div class="logo">🌿</div>
  <div class="title-wrap">
    <div class="title">AI心理智能体工作坊 · 智能客服</div>
    <div class="subtitle">jinlyu.com · 有问必答，答不了的转人工</div>
  </div>
  <div class="status" id="statusDot">连接中…</div>
</header>

<div id="chat">
  <div class="welcome">
    <h2>你好，我是工作坊客服小AI 🌿</h2>
    <p>关于课程安排、报名方式、费用说明、回看方式等问题都可以问我。我只会依据工作坊官方资料回答，答不了的会帮你转人工确认。</p>
    <div class="chips">
      <div class="chip" onclick="quick(this)">这个工作坊适合什么人参加？</div>
      <div class="chip" onclick="quick(this)">课程有回放吗？</div>
      <div class="chip" onclick="quick(this)">报名费用是多少？</div>
      <div class="chip" onclick="quick(this)">你们能提供哪些AI产品？</div>
    </div>
  </div>
</div>

<footer>
  <div class="input-row">
    <input id="input" type="text" placeholder="输入你的问题…" autocomplete="off">
    <button id="send" onclick="send()">发送</button>
  </div>
  <div class="footnote">内容由 AI 生成，仅供参考 · 数据与隐私保护符合工作坊规范</div>
</footer>

<script>
// ===== 部署配置 =====
// 本地/阿里云整套部署时留空（页面和接口同源）。
// 前端放 jinlyu.com（GitHub Pages）时，填后端服务的完整地址，例如：
//   window.API_BASE = "https://xxxx.service.tcloudbase.com";
window.API_BASE = new URLSearchParams(location.search).get("api") || "https://jin-d0gcxzg8k3f764806-14s34397785.ap-shanghai.app.tcloudbase.com";

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendEl = document.getElementById('send');
const statusDot = document.getElementById('statusDot');

// 访客身份：存 localStorage，同一个浏览器保持同一会话
function vid() {
  let v = localStorage.getItem('adp_visitor');
  if (!v) { v = 'v' + Date.now() + Math.random().toString(36).slice(2, 12); localStorage.setItem('adp_visitor', v); }
  return v;
}
let conversationId = localStorage.getItem('adp_conv') || '';
let busy = false;

// 健康检查：显示后端是否配好 AppKey；支持自动刷新，避免页面开得早状态卡住
function checkStatus() {
  fetch((window.API_BASE || '') + '/api/ping').then(r => r.json()).then(d => {
    if (d.mode === 'live') {
      statusDot.textContent = '在线';
      statusDot.classList.remove('off');
    } else {
      statusDot.textContent = '未配置密钥';
      statusDot.classList.add('off');
    }
  }).catch(() => {
    statusDot.textContent = '后端未启动';
    statusDot.classList.add('off');
  });
}
checkStatus();
setInterval(checkStatus, 5000);

function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<div class="avatar">' + (role === 'ai' ? '🌿' : '🙂') + '</div>' +
                  '<div class="bubble"></div>';
  div.querySelector('.bubble').textContent = text;
  chatEl.appendChild(div);
  scrollBottom();
  return div.querySelector('.bubble');
}

function quick(el) { if (!busy) { inputEl.value = el.textContent; send(); } }

inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

async function send() {
  const q = inputEl.value.trim();
  if (!q || busy) return;
  busy = true; sendEl.disabled = true; inputEl.value = '';
  addMsg('me', q);

  // 先放一个"思考中"气泡
  const bubble = addMsg('ai', '');
  bubble.innerHTML = '<span class="thinking"><span class="dots">正在思考</span></span>';

  try {
    const resp = await fetch((window.API_BASE || '') + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: q, conversation_id: conversationId, visitor_id: vid() })
    });
    if (!resp.ok) {
      const e = await resp.json().catch(() => ({}));
      throw new Error(e.error || ('HTTP ' + resp.status));
    }

    // ---- 两种后端兼容 ----
    // 1) JSON 一次性返回（CloudBase 云函数等）：本地模拟打字机
    // 2) 流式返回（app.py 代理）：逐字上屏
    const ctype = (resp.headers.get('content-type') || '').toLowerCase();
    if (ctype.includes('application/json')) {
      const d = await resp.json();
      if (d.error) throw new Error(d.error);
      const answer = d.answer || '';
      if (d.conversation_id) {
        conversationId = d.conversation_id;
        localStorage.setItem('adp_conv', conversationId);
      }
      if (!answer) {
        bubble.textContent = '（本次没有返回内容，请重试或换一个问题）';
      } else {
        await typewriter(bubble, answer);
      }
      if (d.refs && d.refs.length) appendRefs(bubble, d.refs);
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', answer = '', refs = [];

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        let ev; try { ev = JSON.parse(line); } catch { continue; }

        if (ev.type === 'status') {
          bubble.innerHTML = '<span class="thinking"><span class="dots">' +
            esc(ev.text) + '</span></span>';
        } else if (ev.type === 'delta') {
          answer += ev.text;
          bubble.textContent = answer;
          const c = document.createElement('span'); c.className = 'cursor';
          bubble.appendChild(c);
          scrollBottom();
        } else if (ev.type === 'replace') {
          answer = ev.text;
          bubble.textContent = answer;
        } else if (ev.type === 'final') {
          if (ev.text && ev.text !== answer) { answer = ev.text; bubble.textContent = answer; }
        } else if (ev.type === 'refs') {
          refs = ev.refs;
        } else if (ev.type === 'error') {
          bubble.className = 'bubble err';
          bubble.textContent = '⚠️ ' + ev.message;
        } else if (ev.type === 'done') {
          if (ev.conversation_id) {
            conversationId = ev.conversation_id;
            localStorage.setItem('adp_conv', conversationId);
          }
        }
      }
    }

    // 收尾：去掉光标，附上引用
    const cursor = bubble.querySelector('.cursor'); if (cursor) cursor.remove();
    const think = bubble.querySelector('.thinking');
    if (think && !answer && !bubble.classList.contains('err')) {
      bubble.textContent = '（本次没有返回内容，请重试或换一个问题）';
    }
    if (refs.length && answer) appendRefs(bubble, refs);
  } catch (e) {
    bubble.className = 'bubble err';
    bubble.textContent = '⚠️ 连接失败：' + e.message + '\n\n请确认客服后端已启动。';
  } finally {
    busy = false; sendEl.disabled = false; inputEl.focus();
    scrollBottom();
  }
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g,
    m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// 本地模拟打字机（用于一次性返回的后端）
function typewriter(bubble, text) {
  return new Promise(resolve => {
    let i = 0;
    const step = Math.max(1, Math.round(text.length / 120)); // 约2秒打完
    const timer = setInterval(() => {
      i += step;
      bubble.textContent = text.slice(0, i);
      const c = document.createElement('span'); c.className = 'cursor';
      bubble.appendChild(c);
      scrollBottom();
      if (i >= text.length) {
        clearInterval(timer);
        const c2 = bubble.querySelector('.cursor'); if (c2) c2.remove();
        resolve();
      }
    }, 18);
  });
}

// 追加参考来源
function appendRefs(bubble, refs) {
  const rd = document.createElement('div');
  rd.className = 'refs';
  rd.innerHTML = '<div class="ref-title">参考来源</div>' +
    refs.map(r => r.url
      ? '<a href="' + esc(r.url) + '" target="_blank">[' + r.index + '] ' + esc(r.name || '来源') + '</a>'
      : '<span style="font-size:12px;color:#6b7686">[' + r.index + '] ' + esc(r.name || '知识库文档') + '</span>'
    ).join('');
  bubble.parentElement.appendChild(rd);
}
</script>
</body>
</html>
